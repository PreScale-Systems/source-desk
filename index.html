These sample Studio North messages are not real quotes or communications
from real suppliers. No WhatsApp message or email was sent. Review pasted
replies with the sample parser or manual fields; resolve uncertainties.

CUSTOMER REQUIREMENT
Company: Studio North
Contact: Aarav Mehta
Quantity: 2 laptops
AMD Ryzen 9; 32 GB RAM; 2 TB SSD; new; 12 months warranty.
Delivery within 5 days. Budget per laptop: INR 145000 before GST.

OFR-001 \u2014 Vertex Distribution \u2014 WhatsApp (fictional)
Model: ASUS TUF Gaming A15
AMD Ryzen 9 7940HS; 16 GB RAM; 1 TB SSD; new; 12 months warranty.
Unit price: INR 99000 + GST 18%; freight: INR 600 for the shipment.
Available: 4 units. Delivery in 2 days. Price valid for 7 days from enquiry.
Price covers 16 GB RAM and 1 TB SSD. A 32 GB / 2 TB upgrade is not included.

Review: Lowest advertised price, but RAM and SSD miss the requirement.

OFR-002 \u2014 Prime IT Wholesale \u2014 Email (fictional)
Model: ASUS Vivobook Pro 16
AMD Ryzen 9 8945HS; 32 GB RAM; 2 TB SSD; new; 12 months warranty.
Unit price: INR 119500 + GST 18%; freight included.
Available: 3 units. Delivery in 9 days. Price valid for 7 days from enquiry.
No earlier stock is confirmed.

Review: Matches the configuration but misses the five-day deadline.

OFR-003 \u2014 Redwood IT Partners \u2014 WhatsApp (fictional)
Model: ASUS Vivobook Pro 16
AMD Ryzen 9 8945HS; 32 GB RAM; 2 TB SSD; new; 12 months warranty.
Unit price: INR 123000 + GST 18%; freight: INR 1000 for the shipment.
Available: 5 units. Delivery in 3 days. Price valid for 7 days from enquiry.
The requested two-device configuration and delivery timing are confirmed.

Review: Meets the sample configuration, quantity and delivery deadline.
Two laptops have a pre-tax sourcing cost of INR 247000 including freight,
or INR 123500 each. Distributor availability is not owned stock.

OFR-004 \u2014 Metro Tech Supply \u2014 Email (fictional)
Model: ASUS Vivobook Pro 16
AMD Ryzen 9 8945HS; 32 GB RAM; 1 TB SSD; new; 12 months warranty.
Unit price: INR 111000 + GST 18%; freight: INR 800 for the shipment.
